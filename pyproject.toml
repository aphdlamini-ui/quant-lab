[project]
name = "quant-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Thabane", email = "aphdlamini@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9.3",
    "duckdb>=1.5.6",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=1.44.2",
    "py-vollib>=1.0.12",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.4",
    "quantlib>=1.43",
    "requests>=2.34.2",
    "riskfolio-lib>=7.4.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "skfolio>=1.4.11",
    "statsmodels>=0.15.0",
    "yfinance>=1.7.0",
]

[project.scripts]
quant-lab = "quant_lab:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
